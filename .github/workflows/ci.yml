name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
          - label: macos-arm64
            os: macos-15
          - label: windows-x86_64
            os: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install test and build tools
        run: python -m pip install --upgrade pip "maturin==1.11.5" "pytest>=8,<9" "PyHamcrest>=2.0.2" "pytest-benchmark"
      - name: Rust gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Build and install packaged native wheel
        run: |
          maturin build --release --locked --out dist
          python -c "import glob, subprocess, sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
      - name: Candidate contract
        run: python -m pytest -q tests
      - name: Complete frozen upstream suite
        shell: bash
        run: |
          candidate_root=$(python -c 'import site; print(site.getsitepackages()[0])')
          PYTHON=python CANDIDATE_EXPECTED_ROOT="$candidate_root" bash scripts/run_upstream_full.sh
      - name: Isolated 10,000-case differential
        shell: bash
        run: |
          python -m venv oracle-venv
          oracle_python=oracle-venv/bin/python
          if [ ! -x "$oracle_python" ]; then oracle_python=oracle-venv/Scripts/python; fi
          python scripts/run_differential.py --oracle-python "$oracle_python" --candidate-python "$(python -c 'import sys; print(sys.executable)')"

  fallback-wheel:
    name: Build canonical universal fallback
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build canonical universal fallback
        run: |
          python -m pip install "setuptools>=77" wheel build
          python scripts/build_fallback_wheel.py --out-dir dist
          python -c "import glob, zipfile; wheel=glob.glob('dist/*-py3-none-any.whl'); assert len(wheel)==1; z=zipfile.ZipFile(wheel[0]); metadata=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))); assert b'Dynamic:' not in metadata"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-universal-fallback-wheel
          path: dist/*-py3-none-any.whl
          if-no-files-found: error

  fallback-python3:
    name: Fallback / Python ${{ matrix.python }}
    needs: fallback-wheel
    runs-on: ubuntu-22.04
    container:
      image: python:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.7", image: "3.7.17-buster"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-universal-fallback-wheel
          path: dist
      - name: Install the prebuilt universal fallback
        run: |
          python -m pip install "pip<24" "pytest==4.6.11" "PyHamcrest>=2.0.2" "pytest-benchmark==4.0.0"
          python -m pip install --force-reinstall --no-deps dist/*-py3-none-any.whl
      - name: Verify fallback ownership and semantics
        run: python -c "import base58 as m; assert m.__file__.endswith('.py'), m.__file__; assert m.b58encode(b'hello world') == b'StV1DL6CwTryKyV'"
      - name: Complete frozen upstream suite
        shell: bash
        run: PYTHON=python bash scripts/run_upstream_full.sh
      - name: Isolated 10,000-case differential
        shell: bash
        run: |
          python -m venv oracle-venv
          python scripts/run_differential.py --oracle-python oracle-venv/bin/python --candidate-python "$(python -c 'import sys; print(sys.executable)')"
