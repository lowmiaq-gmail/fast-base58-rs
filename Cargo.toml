[package]
name = "fast-rfc3339-validator-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Rust implementation of the rfc3339-validator 0.1.4 contract"
repository = "https://github.com/lowmiaq-gmail/fast-rfc3339-validator-rs"
homepage = "https://github.com/lowmiaq-gmail/fast-rfc3339-validator-rs"
keywords = ["rfc3339", "validation", "python", "pyo3", "datetime"]
categories = ["date-and-time", "parsing"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
