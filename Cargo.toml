[package]
name = "fast-base58-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Rust-backed drop-in replacement for base58 2.1.1"
repository = "https://github.com/lowmiaq-gmail/fast-base58-rs"
homepage = "https://github.com/lowmiaq-gmail/fast-base58-rs"
keywords = ["base58", "encoding", "bitcoin", "python", "pyo3"]
categories = ["encoding", "cryptography::cryptocurrencies"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
