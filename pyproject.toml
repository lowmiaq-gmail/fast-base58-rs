[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fast-rfc3339-validator-rs"
version = "0.1.0"
description = "Fast Rust-backed drop-in replacement for rfc3339-validator 0.1.4"
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fast-rfc3339-validator-rs contributors" }]
dependencies = ["six"]
keywords = ["rfc3339", "rfc3339-validator", "validation", "datetime", "pyo3", "rust", "drop-in-replacement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 2",
  "Programming Language :: Python :: 2.7",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.5",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/lowmiaq-gmail/fast-rfc3339-validator-rs"
Repository = "https://github.com/lowmiaq-gmail/fast-rfc3339-validator-rs"
Issues = "https://github.com/lowmiaq-gmail/fast-rfc3339-validator-rs/issues"
Changelog = "https://github.com/lowmiaq-gmail/fast-rfc3339-validator-rs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "hypothesis>=6",
  "strict-rfc3339==0.7",
]

[tool.maturin]
bindings = "pyo3"
module-name = "rfc3339_validator._native"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = [
  "fallback/build/**",
  "fallback/*.egg-info/**",
]
include = [
  { path = "fallback/rfc3339_validator.py", format = "sdist" },
  { path = "tests/**", format = "sdist" },
]

[tool.maturin.sbom]
rust = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
