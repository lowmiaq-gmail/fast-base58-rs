[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fast-base58-rs"
version = "0.1.0"
description = "Fast Rust-backed drop-in replacement for base58 2.1.1"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fast-base58-rs contributors" }]
dependencies = []
keywords = ["base58", "encoding", "bitcoin", "base58check", "pyo3", "rust", "drop-in-replacement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/lowmiaq-gmail/fast-base58-rs"
Repository = "https://github.com/lowmiaq-gmail/fast-base58-rs"
Issues = "https://github.com/lowmiaq-gmail/fast-base58-rs/issues"
Changelog = "https://github.com/lowmiaq-gmail/fast-base58-rs/blob/main/CHANGELOG.md"

[project.scripts]
base58 = "base58.__main__:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "PyHamcrest>=2.0.2",
  "pytest-benchmark",
]

[tool.maturin]
bindings = "pyo3"
module-name = "base58._native"
python-source = "python"
features = ["pyo3/extension-module"]
exclude = [
  "fallback/build/**",
  "fallback/*.egg-info/**",
]
include = [
  { path = "fallback/base58.py", format = "sdist" },
  { path = "tests/**", format = "sdist" },
]

[tool.maturin.sbom]
rust = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
